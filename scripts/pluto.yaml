services:
  pluto-for-channels: # This docker-compose typically requires no editing. Use the Environment variables section of Portainer to set your values.
    # 2026.08.31
    # GitHub home for this project: https://github.com/maddox/pluto-for-channels
    # Docker Hub home for this project: https://hub.docker.com/r/jonmaddox/pluto-for-channels
    image: jonmaddox/pluto-for-channels:${TAG:-latest}
    container_name: pluto-for-channels
    ports:
      - ${HOST_PORT}:80
    restart: unless-stopped

