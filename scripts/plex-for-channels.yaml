services:
  plex-for-channels: # This docker-compose typically requires no editing. Use the Environment variables section of Portainer to set your values.
    # 2026.08.31
    # GitHub home for this project with setup instructions: https://github.com/jgomez177/plex-for-channels
    # Docker container home for this project: https://ghcr.io/jgomez177/plex-for-channels
    image: ghcr.io/jgomez177/plex-for-channels:${TAG:-latest}
    container_name: plex-for-channels
    ports:
      - ${HOST_PORT}:${PORT}
    environment:
      - PORT=${PORT}
    volumes:
      - ${HOST_DIR}/plex:/app/data
    restart: unless-stopped

# A sample set of Environment variables can be found below -- copy and paste into Portainer-Stacks Environment variables section in Advanced mode.
