services:
  threadfin: # This docker-compose typically requires no editing. Use the Environment variables section of Portainer to set your values.
    # 2026.08.31
    # GitHub home for this project: https://github.com/Threadfin/Threadfin.
    # Docker container home for this project with setup instructions: https://hub.docker.com/r/fyb3roptik/threadfin.
    image: fyb3roptik/threadfin:${TAG:-latest}
    container_name: threadfin
    ports:
      - ${HOST_PORT}:34400
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOST_DIR}/threadfin/conf:/home/threadfin/conf
      - ${HOST_DIR}/threadfin/temp:/tmp/threadfin:rw
    restart: unless-stopped

# A sample set of Environment variables can be found below -- copy and paste into Portainer-Stacks Environment variables section in Advanced mode.
